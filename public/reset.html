<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ตั้งรหัสผ่านใหม่ — REC Marketplace</title>
<style>
  :root { --green:#0b5d3b; --green-d:#094a2f; --bg:#f4f6f8; --err:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); font-family:'Segoe UI',Tahoma,Arial,sans-serif; color:#1c2b22; padding:20px; }
  .card { width:100%; max-width:420px; background:#fff; border-radius:14px;
          box-shadow:0 4px 24px rgba(0,0,0,.08); overflow:hidden; }
  .head { background:var(--green); padding:22px 28px; color:#fff; font-size:19px; font-weight:700; }
  .body { padding:28px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p.sub { margin:0 0 22px; color:#5a6b62; font-size:14px; line-height:1.5; }
  label { display:block; font-size:13px; font-weight:600; margin:0 0 6px; color:#33453b; }
  input { width:100%; padding:12px 14px; border:1.5px solid #d6ddd8; border-radius:9px;
          font-size:15px; margin-bottom:16px; outline:none; transition:border .15s; }
  input:focus { border-color:var(--green); }
  button { width:100%; padding:13px; border:none; border-radius:9px; background:var(--green);
           color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:background .15s; }
  button:hover:not(:disabled) { background:var(--green-d); }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .msg { font-size:14px; margin:0 0 16px; padding:11px 14px; border-radius:9px; line-height:1.5; display:none; }
  .msg.err { display:block; background:#fdecea; color:var(--err); }
  .msg.ok  { display:block; background:#e8f6ee; color:var(--green); }
  .hint { font-size:12px; color:#8a9890; margin:8px 0 0; }
  .center { text-align:center; }
  a { color:var(--green); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">REC Marketplace</div>
    <div class="body">
      <h1>ตั้งรหัสผ่านใหม่</h1>
      <p class="sub">กรอกรหัสผ่านใหม่ของคุณด้านล่าง ลิงก์นี้ใช้ได้ครั้งเดียวและหมดอายุภายใน 30 นาที</p>

      <div id="msg" class="msg"></div>

      <form id="form">
        <label for="pw">รหัสผ่านใหม่</label>
        <input id="pw" type="password" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัวอักษร" required />

        <label for="pw2">ยืนยันรหัสผ่านใหม่</label>
        <input id="pw2" type="password" autocomplete="new-password" placeholder="พิมพ์รหัสผ่านอีกครั้ง" required />

        <button id="btn" type="submit">บันทึกรหัสผ่านใหม่</button>
        <p class="hint">หลังตั้งรหัสผ่านสำเร็จ คุณจะเข้าสู่ระบบด้วยรหัสใหม่ได้ทันที</p>
      </form>

      <div id="done" style="display:none;" class="center">
        <p class="msg ok" style="display:block;">ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว ✓</p>
        <p><a href="/">กลับไปหน้าเข้าสู่ระบบ</a></p>
      </div>
    </div>
  </div>

<script>
  var params = new URLSearchParams(location.search);
  var token = params.get('token');
  var msg = document.getElementById('msg');
  var form = document.getElementById('form');
  var btn = document.getElementById('btn');

  function showErr(t){ msg.className = 'msg err'; msg.textContent = t; }

  if (!token) {
    showErr('ลิงก์ไม่ถูกต้อง — ไม่พบ token กรุณาขอลิงก์รีเซ็ตใหม่จากหน้าเข้าสู่ระบบ');
    btn.disabled = true;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    var pw2 = document.getElementById('pw2').value;
    msg.className = 'msg'; // clear

    if (pw.length < 8) return showErr('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
    if (pw !== pw2) return showErr('รหัสผ่านทั้งสองช่องไม่ตรงกัน');

    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try {
      var r = await fetch('/api/auth/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, newPassword: pw })
      });
      var data = await r.json().catch(function(){ return {}; });
      if (r.ok && data.ok) {
        form.style.display = 'none';
        document.getElementById('done').style.display = 'block';
      } else {
        showErr((data && data.error) || 'ตั้งรหัสผ่านไม่สำเร็จ ลิงก์อาจหมดอายุ');
        btn.disabled = false; btn.textContent = 'บันทึกรหัสผ่านใหม่';
      }
    } catch (err) {
      showErr('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่');
      btn.disabled = false; btn.textContent = 'บันทึกรหัสผ่านใหม่';
    }
  });
</script>
</body>
</html>
