services:
  - type: web
    name: rec-marketplace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: REC_PRICE_THB
        value: "40"
      - key: TREASURY_REC
        value: "1000000"
      - key: PAYMENT_MODE
        value: mock
      - key: AML_REVIEW_THRESHOLD
        value: "5000000"
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
